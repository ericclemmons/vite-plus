name: Publish to pkg.pr.new

# Fork-only preview: builds darwin-arm64 and linux-x64-gnu and publishes
# `vite-plus`, `@voidzero-dev/vite-plus-core` and their platform packages to
# pkg.pr.new, so a project can install this branch with
# `pnpm add -D https://pkg.pr.new/<owner>/vite-plus/vite-plus@<short-sha>`.
# Requires the pkg.pr.new GitHub App (https://github.com/apps/pkg-pr-new) on
# the repository.

permissions: {}

on:
  push:
    branches:
      - feat/adhoc-cached-command
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Compute preview metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Compute version
        id: version
        run: echo "version=0.0.0-commit.${{ github.sha }}" >> "$GITHUB_OUTPUT"

  build-rust:
    name: Build bindings and binaries
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-release-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      cache-key: pkg-pr-new
      targets: >-
        [
          {"target": "aarch64-apple-darwin", "os": "macos-latest"},
          {"target": "x86_64-unknown-linux-gnu", "os": "ubuntu-latest"}
        ]

  publish:
    name: Publish to pkg.pr.new
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-rust
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: ./.github/actions/clone

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Set preview package versions
        run: |
          for package in cli core; do
            pnpm exec json-edit "packages/$package/package.json" '_.version = process.env.VERSION'
          done

      - name: Download cli dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages/cli/dist
          pattern: cli
          merge-multiple: true

      - name: Download cli docs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages/cli/docs
          pattern: cli-docs
          merge-multiple: true

      - name: Download cli binding
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages/cli/artifacts
          pattern: vite-plus-native-*

      - name: Download core dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages/core/dist
          pattern: core
          merge-multiple: true

      - uses: ./.github/actions/download-rolldown-binaries
        with:
          github-token: ${{ github.token }}
          target: x86_64-unknown-linux-gnu
          upload: 'false'

      # Only the targets built above get platform packages.
      - name: Limit native targets
        run: |
          pnpm exec json-edit packages/cli/package.json \
            '_.napi.targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]'

      - name: Prepare native addon packages
        run: node ./packages/cli/publish-native-addons.ts --mode pkg-pr-new --phase native

      # pkg-pr-new rewrites dependencies by package name, so the `vite` alias of
      # core would still point at npm. Point it at this commit's core tarball.
      - name: Point the vite alias at the preview core
        run: |
          export CORE_URL="https://pkg.pr.new/${GITHUB_REPOSITORY}/@voidzero-dev/vite-plus-core@${GITHUB_SHA::7}"
          pnpm exec json-edit packages/cli/package.json '_.dependencies.vite = process.env.CORE_URL'

      - name: Publish to pkg.pr.new
        run: |
          pnpm dlx pkg-pr-new@0.0.93 publish --pnpm --no-compact --commentWithSha --commentWithDev --packageManager=pnpm \
            './packages/cli/npm/*' \
            './packages/cli' \
            './packages/core'
